          <rect x="-4" y="-18" width="8" height="36" rx="2" fill="#000000" />
          <rect x="-4" y="-18" width="8" height="36" rx="2" fill="#000000" transform="rotate(60)" />
          <rect x="-4" y="-18" width="8" height="36" rx="2" fill="#000000" transform="rotate(120)" />
